<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time AI Avatar with RAG</title>
  <desc id="desc">A technical card showing an AI avatar connected to a retrieval graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130d23"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <text x="78" y="108" fill="#c4b5fd" font-family="Geist, Arial, sans-serif" font-size="22" letter-spacing="4">MULTIMODAL RAG</text>
  <text x="78" y="168" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="56" font-weight="700">AI AVATAR</text>
  <text x="78" y="222" fill="#7dd3fc" font-family="Geist, Arial, sans-serif" font-size="35" font-weight="600">grounded, voiced, animated</text>
  <g transform="translate(126 326)">
    <rect x="0" y="0" width="318" height="270" rx="28" fill="#020617" opacity=".68" stroke="#7dd3fc"/>
    <circle cx="159" cy="96" r="58" fill="url(#skin)" opacity=".9"/>
    <path d="M75 237c15-72 55-104 84-104s69 32 84 104" fill="none" stroke="#c4b5fd" stroke-width="22" stroke-linecap="round"/>
    <circle cx="138" cy="91" r="7" fill="#020617"/>
    <circle cx="180" cy="91" r="7" fill="#020617"/>
    <path d="M139 122c16 13 30 13 45 0" stroke="#020617" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(548 228)" fill="none" stroke="#ffffff" stroke-width="3" opacity=".72">
    <path d="M64 234l158-96 132 134 202-184"/>
    <path d="M222 138l334-50"/>
    <path d="M222 138l-18 260 150-126"/>
    <path d="M354 272l202-184 40 282"/>
  </g>
  <g fill="#5eead4" filter="url(#glow)">
    <circle cx="612" cy="462" r="18"/>
    <circle cx="770" cy="366" r="18"/>
    <circle cx="902" cy="500" r="18"/>
    <circle cx="1104" cy="316" r="18"/>
    <circle cx="752" cy="626" r="18"/>
    <circle cx="1144" cy="598" r="18"/>
  </g>
  <g transform="translate(676 638)">
    <rect width="370" height="78" rx="18" fill="#020617" opacity=".75" stroke="#7c3aed"/>
    <text x="26" y="32" fill="#a5b4fc" font-family="Geist, Arial, sans-serif" font-size="17">RESPONSE LOOP</text>
    <text x="26" y="60" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="28" font-weight="700">200-400ms pilot latency</text>
  </g>
</svg>
