  <g transform="translate(112 630)" font-family="Geist, Arial, sans-serif">
    <rect width="330" height="86" rx="18" fill="#020617" opacity=".75" stroke="#164e63"/>
    <text x="24" y="36" fill="#94a3b8" font-size="17">GOVERNANCE</text>
    <text x="24" y="66" fill="#ffffff" font-size="24" font-weight="700">TOKEN &amp; COST BUDGETS</text>
  </g>
  <g transform="translate(472 630)" font-family="Geist, Arial, sans-serif">
    <rect width="330" height="86" rx="18" fill="#020617" opacity=".75" stroke="#164e63"/>
    <text x="24" y="36" fill="#94a3b8" font-size="17">CONTROL</text>
    <text x="24" y="66" fill="#ffffff" font-size="24" font-weight="700">HUMAN-IN-THE-LOOP</text>
  </g>

  <g transform="translate(880 168)">
    <circle cx="110" cy="110" r="96" fill="#020617" opacity=".78" stroke="#5eead4" stroke-width="3"/>
    <circle cx="110" cy="110" r="24" fill="#5eead4" filter="url(#glow)"/>
    <g stroke="#38bdf8" stroke-width="6" opacity=".85">
      <path d="M110 110 34 66M110 110l76-44M110 110v88M110 110l72 40"/>
