<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Xplortiv AI Recommendation and Discovery Engine</title>
  <desc id="desc">A technical card showing a GRU ranking model with multi-head prediction and vector search.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#122f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <circle cx="940" cy="620" r="210" fill="#0f766e" opacity=".16"/>
  <circle cx="180" cy="150" r="200" fill="#2563eb" opacity=".12"/>
  <g opacity=".2" stroke="#ffffff" stroke-width="1">
    <path d="M90 120H1110"/>
    <path d="M90 280H1110"/>
    <path d="M90 440H1110"/>
    <path d="M90 600H1110"/>
  </g>
  <text x="82" y="104" fill="#9ca3af" font-family="Geist, Arial, sans-serif" font-size="22" letter-spacing="4">RANKING &amp; SEMANTIC SEARCH</text>
  <text x="82" y="168" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="58" font-weight="700">XPLORTIV</text>
  <text x="82" y="224" fill="#5eead4" font-family="Geist, Arial, sans-serif" font-size="36" font-weight="600">sub-50 ms venue retrieval</text>

  <g transform="translate(96 300)" font-family="Geist, Arial, sans-serif">
    <rect width="164" height="80" rx="18" fill="#020617" opacity=".8" stroke="#164e63"/>
    <text x="22" y="34" fill="#94a3b8" font-size="16">EVENTS</text>
    <text x="22" y="64" fill="#ffffff" font-size="24" font-weight="700">SHORT</text>
    <rect y="98" width="164" height="80" rx="18" fill="#020617" opacity=".8" stroke="#164e63"/>
    <text x="22" y="132" fill="#94a3b8" font-size="16">EVENTS</text>
    <text x="22" y="162" fill="#ffffff" font-size="24" font-weight="700">MEDIUM</text>
    <rect y="196" width="164" height="80" rx="18" fill="#020617" opacity=".8" stroke="#164e63"/>
    <text x="22" y="230" fill="#94a3b8" font-size="16">EVENTS</text>
    <text x="22" y="260" fill="#ffffff" font-size="24" font-weight="700">LONG</text>
    <path d="M164 40h180M164 138h180M164 236h180" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(440 300)" font-family="Geist, Arial, sans-serif">
    <rect width="210" height="276" rx="22" fill="#020617" opacity=".85" stroke="#5eead4" stroke-width="3"/>
    <text x="105" y="126" fill="#ffffff" font-size="34" font-weight="700" text-anchor="middle">GRU</text>
    <text x="105" y="164" fill="#94a3b8" font-size="19" text-anchor="middle">encoder</text>
    <text x="105" y="200" fill="#5eead4" font-size="18" text-anchor="middle">task-conditioned</text>
    <text x="105" y="226" fill="#5eead4" font-size="18" text-anchor="middle">gating</text>
  </g>

  <g transform="translate(650 300)" stroke="url(#accent)" stroke-width="4" fill="none" opacity=".85">
    <path d="M0 138h70v-117h96M0 138h70v-67h96M0 138h70v-15h96M0 138h70v37h96M0 138h70v89h96"/>
  </g>

  <g transform="translate(820 300)" font-family="Geist, Arial, sans-serif" fill="#e0f2fe" font-size="21">
    <rect x="0" y="4" width="150" height="34" rx="10" fill="#020617" opacity=".78" stroke="#164e63"/>
    <text x="18" y="28">skip</text>
    <rect x="0" y="54" width="150" height="34" rx="10" fill="#020617" opacity=".78" stroke="#164e63"/>
    <text x="18" y="78">watch</text>
    <rect x="0" y="106" width="150" height="34" rx="10" fill="#020617" opacity=".78" stroke="#5eead4"/>
    <text x="18" y="130" fill="#5eead4">book</text>
    <rect x="0" y="158" width="150" height="34" rx="10" fill="#020617" opacity=".78" stroke="#164e63"/>
    <text x="18" y="182">verify</text>
    <rect x="0" y="210" width="150" height="34" rx="10" fill="#020617" opacity=".78" stroke="#164e63"/>
    <text x="18" y="234">capture</text>
    <text x="0" y="284" fill="#94a3b8" font-size="17" letter-spacing="2">9 PREDICTION HEADS</text>
  </g>

  <g transform="translate(112 640)" font-family="Geist, Arial, sans-serif">
    <rect width="300" height="86" rx="18" fill="#020617" opacity=".75" stroke="#164e63"/>
    <text x="24" y="36" fill="#94a3b8" font-size="17">EMBEDDINGS</text>
    <text x="24" y="66" fill="#ffffff" font-size="24" font-weight="700">BGE 128-D</text>
  </g>
  <g transform="translate(442 640)" font-family="Geist, Arial, sans-serif">
    <rect width="330" height="86" rx="18" fill="#020617" opacity=".75" stroke="#164e63"/>
    <text x="24" y="36" fill="#94a3b8" font-size="17">SERVING</text>
    <text x="24" y="66" fill="#ffffff" font-size="24" font-weight="700">pgvector / ScaNN</text>
  </g>
  <g transform="translate(802 640)" font-family="Geist, Arial, sans-serif">
    <rect width="286" height="86" rx="18" fill="#020617" opacity=".75" stroke="#164e63"/>
    <text x="24" y="36" fill="#94a3b8" font-size="17">MLOPS</text>
    <text x="24" y="66" fill="#ffffff" font-size="24" font-weight="700">Vertex AI + INT8</text>
  </g>
</svg>
