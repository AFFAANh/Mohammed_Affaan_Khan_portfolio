    <path d="M90 240H1110"/>
    <path d="M90 360H1110"/>
    <path d="M90 480H1110"/>
    <path d="M90 600H1110"/>
  </g>
  <text x="82" y="104" fill="#9ca3af" font-family="Geist, Arial, sans-serif" font-size="22" letter-spacing="4">REAL-TIME PIPELINE</text>
  <text x="82" y="168" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="58" font-weight="700">VOICE AGENT</text>
  <text x="82" y="224" fill="#5eead4" font-family="Geist, Arial, sans-serif" font-size="38" font-weight="600">10K+ concurrent calls</text>
  <g transform="translate(96 330)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 80C70 5 128 5 194 80S320 155 392 80 520 5 594 80 720 155 790 80" stroke="url(#accent)" stroke-width="16" filter="url(#glow)"/>
    <path d="M0 160C70 86 128 86 194 160s126 74 198 0 128-74 202 0 126 74 196 0" stroke="#e0f2fe" stroke-width="6" opacity=".75"/>
