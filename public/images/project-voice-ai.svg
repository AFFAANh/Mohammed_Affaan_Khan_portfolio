    <circle cx="190" cy="190" r="28" fill="#5eead4" filter="url(#glow)"/>
    <path d="M190 50v54M190 276v54M50 190h54M276 190h54M91 91l38 38M251 251l38 38M289 91l-38 38M129 251l-38 38" stroke="#e0f2fe" stroke-width="10" stroke-linecap="round" opacity=".7"/>
