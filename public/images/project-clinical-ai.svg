<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">NHS AI Clinical Workflow System</title>
  <desc id="desc">A clinical AI card with CT scan analysis and workflow panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071317"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <text x="76" y="104" fill="#99f6e4" font-family="Geist, Arial, sans-serif" font-size="22" letter-spacing="4">MEDTECH WORKFLOW</text>
  <text x="76" y="166" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="54" font-weight="700">CLINICAL AI</text>
  <text x="76" y="220" fill="#fca5a5" font-family="Geist, Arial, sans-serif" font-size="34" font-weight="600">CT analysis to reporting</text>
  <g transform="translate(92 308)">
    <rect width="395" height="346" rx="30" fill="#020617" opacity=".72" stroke="#334155"/>
    <circle cx="198" cy="172" r="122" fill="#111827" stroke="#64748b" stroke-width="3"/>
    <circle cx="198" cy="172" r="88" fill="none" stroke="#94a3b8" stroke-width="12" opacity=".28"/>
    <path d="M160 107c-43 30-60 104-29 145 26 34 69 11 69-30V111c0-14-20-15-40-4Z" fill="#38bdf8" opacity=".28"/>
    <path d="M236 107c43 30 60 104 29 145-26 34-69 11-69-30V111c0-14 20-15 40-4Z" fill="#38bdf8" opacity=".28"/>
    <circle cx="262" cy="226" r="18" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="262" cy="226" r="39" fill="none" stroke="#fb7185" stroke-width="4"/>
  </g>
  <g transform="translate(580 314)" font-family="Geist, Arial, sans-serif">
    <rect width="500" height="76" rx="16" fill="#020617" opacity=".7" stroke="#475569"/>
    <text x="24" y="31" fill="#94a3b8" font-size="16">SEGMENTATION</text>
    <text x="24" y="59" fill="#ffffff" font-size="27" font-weight="700">Dice coefficient &gt; 0.85</text>
    <rect y="106" width="500" height="76" rx="16" fill="#020617" opacity=".7" stroke="#475569"/>
    <text x="24" y="137" fill="#94a3b8" font-size="16">CLASSIFIER</text>
    <text x="24" y="165" fill="#ffffff" font-size="27" font-weight="700">92% risk accuracy</text>
    <rect y="212" width="500" height="76" rx="16" fill="#020617" opacity=".7" stroke="#475569"/>
    <text x="24" y="243" fill="#94a3b8" font-size="16">REPORTING</text>
    <text x="24" y="271" fill="#ffffff" font-size="27" font-weight="700">30 min to about 5 min</text>
  </g>
</svg>
