  <text x="82" y="168" fill="#ffffff" font-family="Geist, Arial, sans-serif" font-size="58" font-weight="700">MASKANX</text>
  <text x="82" y="224" fill="#5eead4" font-family="Geist, Arial, sans-serif" font-size="36" font-weight="600">agentic email &amp; voice outreach</text>

